[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "libdiff"
version = "0.3.0"
description = "Liberty (.lib) compare/analysis for FIP stdcell/SRAM design teams"
readme = "README.md"
license = { text = "GPL-2.0-only" }
requires-python = ">=3.8"
dependencies = [
  "numpy",
  "matplotlib>=2.2.2",
  "PyQt5",
  "PyQt-Fluent-Widgets>=1.11.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
libdiff = "libdiff.cli:main"

[tool.setuptools.packages.find]
include = ["libdiff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

